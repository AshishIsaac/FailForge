<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FailForge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6fd6'/%3E%3Cpath d='M9 8h14v4H13v3h8v4h-8v5H9z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo">F</span><div><b>FailForge</b><small>model QA &amp; targeted synthetic data</small></div></div>
  <div id="env" class="env"></div>
  <button id="theme" class="ghost" title="Toggle theme" aria-label="Toggle theme">◐</button>
</header>
<div class="layout">
  <aside>
    <section class="panel">
      <h3>Run the loop</h3>
      <div id="profiles" class="profiles"></div>
      <button id="start" class="primary">Start</button>
      <p id="start-msg" class="muted small"></p>
    </section>
    <section class="panel">
      <h3>Runs</h3>
      <div id="runs" class="runs"></div>
    </section>
    <section class="panel" id="champ-panel">
      <h3>Champion models</h3>
      <div id="champions" class="small"></div>
    </section>
  </aside>
  <main>
    <div id="run-head"></div>
    <nav class="tabs" id="tabs">
      <button data-tab="pipeline" class="on">Pipeline</button>
      <button data-tab="failures">Failure modes</button>
      <button data-tab="synthesis">Synthesis</button>
      <button data-tab="results">Results &amp; gate</button>
      <button data-tab="log">Log</button>
    </nav>
    <section id="tab-pipeline" class="tab on"></section>
    <section id="tab-failures" class="tab"></section>
    <section id="tab-synthesis" class="tab"></section>
    <section id="tab-results" class="tab"></section>
    <section id="tab-log" class="tab"><pre id="log"></pre></section>
  </main>
</div>
<div id="tip" class="tip"></div>
<script src="/static/app.js"></script>
</body>
</html>
